# Production compose that pulls prebuilt images from GitHub Container Registry
# instead of building from source. Intended for install-from-image deployments:
#
#   curl -LO https://raw.githubusercontent.com/KisaesDevLab/Vibe-Trial-Balance/main/docker-compose.prod.images.yml
#   cp .env.example .env  # fill in required vars
#   docker compose -f docker-compose.prod.images.yml up -d
#
# Override the image tag by setting IMAGE_TAG in .env (defaults to `latest`).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibetb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (no default allowed in production)}
      POSTGRES_DB: vibe_tb_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibetb -d vibe_tb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/kisaesdevlab/vibe-tb-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vibe_tb_db
      DB_USER: vibetb
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (use `openssl rand -hex 32`)}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env (use `openssl rand -hex 32`)}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN must be set in .env (e.g. https://your-host)}
      APP_BASE_URL: ${APP_BASE_URL:-${ALLOWED_ORIGIN}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/app/server/uploads
      - backups:/app/server/backups
    ports:
      - "3001:3001"

  client:
    image: ghcr.io/kisaesdevlab/vibe-tb-client:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
  backups:
