services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibetb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (no default allowed in production)}
      POSTGRES_DB: vibe_tb_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Memory cap sized for a Raspberry Pi 5 (8GB). Adjust upward on larger hosts.
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibetb -d vibe_tb_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vibe_tb_db
      DB_USER: vibetb
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (use `openssl rand -hex 32`)}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env (use `openssl rand -hex 32`)}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN must be set in .env (e.g. https://your-host)}
      APP_BASE_URL: ${APP_BASE_URL:-${ALLOWED_ORIGIN}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      STRICT_AI_URL_SAFETY: ${STRICT_AI_URL_SAFETY:-}
      # Cap the Node heap on Pi-class hardware so OOMs take down the container
      # rather than thrashing the whole host.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1024}
    volumes:
      - uploads:/app/server/uploads
      - backups:/app/server/backups
    # NOTE: the server does NOT publish a host port. Client (nginx) talks to it
    # on the internal Docker network. Exposing 3001 to the host bypasses nginx
    # rate limiting and the /api/v1/backup/ body-size cap.
    expose:
      - "3001"
    mem_limit: 1536m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/v1/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m
    mem_reservation: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
  backups:
