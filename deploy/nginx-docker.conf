server {
    listen 80;
    server_name _;

    # Serve React frontend
    root /usr/share/nginx/html;
    index index.html;

    # Backup / restore endpoints handle .tbak archives up to ~500 MB. Keep this
    # block BEFORE the generic /api/ block so it wins the location match.
    location /api/v1/backup/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }
    location /api/v1/restore/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 500M;
    }

    # Import endpoints run OCR / vision pipelines that can take many minutes
    # on a multi-page PDF. Must win the location match over generic /api/.
    location /api/v1/import/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 50M;
    }

    # Support chat is Server-Sent Events. nginx's default proxy_buffering=on
    # would hold every SSE chunk until the response completed, defeating the
    # whole point of streaming. Default timeouts (60s) also kill long Claude
    # responses mid-stream. Must win the location match over generic /api/.
    location /api/v1/support/chat {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API proxy to Node.js backend (Docker service name)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # MCP (Model Context Protocol) — SSE requires no buffering and long timeouts
    location /mcp/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 10M;
    }

    # ES module assets. nginx's bundled mime.types has no entry for `.mjs`
    # (checked against nginx 1.29), so it falls through to
    # `default_type application/octet-stream` — and a browser refuses to execute
    # a module script served with that Content-Type, which is what breaks the
    # pdf.js worker with "Failed to fetch dynamically imported module".
    #
    # Scoped to a location on purpose: a `types { ... }` block at server level
    # REPLACES the whole inherited table rather than adding to it, which would
    # silently un-type every other asset. A regex location also wins over the
    # `/` prefix match, so the file is served rather than falling into the
    # SPA's try_files → index.html.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # The SPA entry point must never be cached. It is the file that names the
    # hashed asset bundle, so a stale copy pins a browser to a previous deploy;
    # with no Cache-Control header at all a browser applies HEURISTIC caching
    # and invents a lifetime from Last-Modified, which is how a client can keep
    # running an old build for days after a fix ships. It is also rewritten in
    # place at container start (deploy/web-entrypoint.sh substitutes the
    # __VIBE_BASE_PATH__ sentinel), so its bytes can change without its name.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # React Router — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
